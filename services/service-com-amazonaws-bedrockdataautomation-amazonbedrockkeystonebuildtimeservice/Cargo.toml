[package]
name = "service-com-amazonaws-bedrockdataautomation-amazonbedrockkeystonebuildtimeservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share.
service-common = { path = "../common" }
# The STS store, for the identity an access key id speaks for: the principal
# `sts:GetCallerIdentity` answers for the credentials a request signed with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The IAM store, for the identity-based policy documents in force on that principal, which
# is what the authorization gate in front of this service's handlers decides on.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Amazon S3 client the buckets an ingestion submission's locations name are resolved
# through before the job is minted (`state::ingestion_locations`): S3 is called over the
# in-process callback into this same emulator, so no network client feature is enabled.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Declares one module per `tests/all/<name>.rs`, so a suite is a new file and nothing
# has to be listed by hand.
automod = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# The Bedrock control plane, mounted beside this service on one engine — the way the
# assembled emulator runs them. It binds this service's three tagging paths identically,
# so the family's claim rule gives that segment to it and a tagging call about one of THIS
# service's resources only reaches these handlers with both services mounted.
service-com-amazonaws-bedrock-amazonbedrockcontrolplaneservice = { workspace = true }
# Amazon S3 is mounted beside this service on one engine — the way the assembled emulator
# runs them — so the locations a submission names are staged in, and resolved against, the
# store that really owns them.
service-com-amazonaws-s3-amazons3 = { workspace = true }

[lints]
workspace = true
