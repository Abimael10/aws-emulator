[package]
name = "service-com-amazonaws-appflow-sandstoneconfigurationservicelambda"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time` beyond the workspace default: a flow RUN bounds its own caller-sized work with
# a wall-clock budget (`tokio::time::timeout`), so the timer driver has to be compiled in.
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
# `serde_json`'s `RawValue`, so an array of records is taken apart into the raw text of
# each element and a record is only built once the run's allowances have admitted it.
serde_json = { workspace = true, features = ["raw_value"] }
tracing = { workspace = true }
# The one object store in this emulator is the Amazon S3 service's: a flow whose source
# and destination are Amazon S3 locations reads and writes its records there.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# The session registry, so the principal a flow records as its author and its last editor
# is the identity the credential the request was signed with was minted for (see
# `crate::state::caller_arn`).
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# `iam_authorization`: the one reading of a resource-based policy, shared with every other
# service that asks whether a bucket policy admits what it is about to do.
service-common = { path = "../common" }
# The order-preserving map a record a run moves is held in, so the fields of each record
# reach the destination file in the order the source presented them.
indexmap = { version = "2.14", features = ["serde"] }
# The `CSV` file type a flow's source and destination can declare, read and written by a
# maintained CSV implementation rather than by hand.
csv = "1.3"
# The `PARQUET` file type a flow's destination can declare, written by the Apache
# implementation of the format, so what lands in the bucket is a file any Parquet reader
# reads. `snap` is the one compression codec it needs; the rest of the crate's backends
# are left out.
parquet = { version = "60", default-features = false, features = ["snap"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# The IAM store, so a test can seed the account's record of which user holds a long-term
# access key — the record `crate::state::caller_arn` resolves such a key's identity
# through.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
[lints]
workspace = true
