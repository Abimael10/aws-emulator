[package]
name = "service-com-amazonaws-location-locationservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `service-common` carries the workspace's ONE caller-supplied-ARN parse, which the tag
# operations read their `ResourceArn` against — the vendor field before any lookup, then
# the resource type and id the ARN addresses — rather than splitting the value here; the
# status and the framing of an answer that carries no content, which this service's tag
# mutations answer at (`no_content_responses`); and the one reader of the error shape a
# failure names in `x-amzn-errortype` (`error_type_locator`).
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Polygon geometry checks for geofence writes: ring self-intersection, ring-to-ring
# touching or crossing, interior-ring containment (winding number) and the signed area
# a ring's winding order is read from, all from the crate's closed-polyline predicates.
cavalier_contours = "0.9"
# PNG codec for the map sprite sheet a sprite read serves as `image/png`, and for
# the raster map tiles a raster basemap's tile read serves.
png = "0.17"
# `vector-tile` carries the workspace's ONE Mapbox Vector Tile encoder, which a
# vector tile read answers through — the same codec the Maps V2 plane's tiles are
# built with, rather than a second copy of that wire format here.
vector-tile = { path = "../vector-tile" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The one integration-test target's suite list: `tests/all/main.rs` declares one
# module per `tests/all/<name>.rs`, so a new suite is a new file and nothing else.
automod = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# RFC 3986 percent-encoding, so a test can put an ARN in a single-segment
# `@httpLabel` and tag keys in `@httpQuery` values the way an SDK does.
percent-encoding = "2.3"

[lints]
workspace = true
