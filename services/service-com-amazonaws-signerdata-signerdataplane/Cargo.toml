[package]
name = "service-com-amazonaws-signerdata-signerdataplane"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `service-common` carries the ONE reading that lets an `@httpQuery` timestamp bind in
# every form the wire names an instant in (`query_timestamps`), which
# `GetRevocationStatus`' `signatureTimestamp` needs — see `src/service.rs`.
service-common = { path = "../common" }
# AWS Signer's CONTROL plane, for the ONE authorization gate both views of this API
# decide a call with (`state::authorization`): the two endpoints publish the same
# `signer` IAM action namespace and the same `GetRevocationStatus`, so a caller's
# identity-based policy has to decide this endpoint's call exactly as it decides the
# control plane's — one rule, one home, rather than a second copy here.
service-com-amazonaws-signer-wallabyservice = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
