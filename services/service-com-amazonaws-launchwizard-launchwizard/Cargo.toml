[package]
name = "service-com-amazonaws-launchwizard-launchwizard"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque pagination tokens: the cursor is hex-encoded so a client cannot read a
# position out of a `nextToken` or forge one.
hex = { workspace = true }
# The digest `state::fresh_uuid_v4` lays out as a deployment id, so minting one
# pulls in no crate this workspace does not already build.
sha2 = { workspace = true }
# `service-common` carries the workspace's ONE authenticator over a value a store hands out
# and takes back (`page_tokens::PageTokenKey`), which the address of a catalogue entry's icon
# carries so only an address this store minted resolves — and `record_identicon`, the one
# renderer of the image a service serves for a record it holds no uploaded bytes for.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Tests forge a pagination token with the same encoding `state::encode_token` issues
# one with, rather than hand-rolling hex beside it.
hex = { workspace = true }
# DEV-ONLY: reads back the PNG a workload catalogue entry's icon is served as, so the suite
# that follows an `iconUrl` decodes a real image rather than checking its first bytes. The
# image itself is WRITTEN by the one renderer every such service shares
# (`service_common::record_identicon`), so the library build links no codec of its own.
png = "0.18"

[lints]
workspace = true
