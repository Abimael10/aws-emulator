[package]
name = "service-com-amazonaws-observabilityadmin-observabilityadmin"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes/decodes the opaque `NextToken` the list operations hand out.
hex = { workspace = true }
# Reads the caller-supplied telemetry pipeline configuration document, which is YAML
# (or the JSON that YAML 1.2 is a superset of). yaml-rust2 is the pure-Rust YAML 1.2
# implementation the sibling apigateway, cloudformation and amp crates already read
# caller-supplied documents with, and it exposes the parser's EVENT stream, which is
# where an alias can be refused instead of expanded.
yaml-rust2 = { version = "0.10", default-features = false }
# Reads one CSV row for the `csv` processor, so a quoted field carrying the delimiter
# or a newline is one field as CSV defines it.
csv = "1.3"
# Compiles the `substitute_string` processor's pattern. The crate matches in time
# linear in the subject and takes a compile-time size limit, so a caller-supplied
# pattern cannot make one record's match unbounded.
regex = "1.12"
# `service-common` carries this tree's ONE caller-supplied-ARN parse, which the
# integration-scoped refusals read the resource field of a requested `Arn` from
# (`arn::resource`) rather than splitting the value here again.
service-common = { path = "../common" }
# The AWS SDK for Amazon EC2, driven over the in-process callback
# (`OperationContext::callback`): a telemetry configuration is a fact about the resource of
# ANOTHER service, so the telemetry-config audit reads this account's instances, VPCs and
# flow logs through Amazon EC2's own API (`state::resource_telemetry`) rather than out of
# this crate's store. Only the generated client is needed — the emulator supplies the
# transport.
aws-sdk-ec2 = { version = "1", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# Amazon EC2 is mounted beside this service on one engine where a suite is about the
# telemetry-config AUDIT: the audit reads the instances and VPCs it reports from EC2's own
# API (`state::resource_telemetry`), so without EC2 mounted there is nothing to audit.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
# `percent-encoding`: those EC2 setup calls travel as `application/x-www-form-urlencoded`, so
# each component is encoded by this crate rather than by a hand-written escaper.
percent-encoding = "2"

[lints]
workspace = true
