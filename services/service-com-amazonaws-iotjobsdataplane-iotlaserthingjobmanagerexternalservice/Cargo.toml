[package]
name = "service-com-amazonaws-iotjobsdataplane-iotlaserthingjobmanagerexternalservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `service-common` carries both IoT stores this crate reaches: the job-execution
# store it shares with the IoT control plane (which creates an execution when a job
# targets a thing), and `iot_commands`, the index of which commands exist that
# `StartCommandExecution` validates `commandArn` against.
service-common = { path = "../common" }
# Digest behind the minted executionId and the clientToken idempotency fingerprint.
sha2 = { workspace = true }
# Renders those digests as the hex an executionId's pattern allows.
hex = { workspace = true }
# The IoT DATA plane, in the SAME shared engine: an execution a device reports
# `SUCCEEDED` is what makes a job's package version reporting due, and the reserved
# `$package` named shadow that reporting writes lives in that service's shadow store —
# written through its own
# `state::package_version_reporting` rather than through a second copy of the store here.
service-com-amazonaws-iotdataplane-iotmoonrakerservice = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
