[package]
name = "service-com-amazonaws-sagemakermetrics-sagemakermetricsservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share.
service-common = { path = "../common" }
# Judges a SageMaker resource reference against the expression the model constrains it
# with, now that the reference is resolved by the handler rather than at the boundary.
regex = "1.12"
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The metrics this service ingests belong to a trial component the SageMaker CONTROL PLANE
# owns, and both services publish their actions under the one `sagemaker` namespace: the
# authorization decision, the ARN spelling and the signed Region are that service's own.
service-com-amazonaws-sagemaker-sagemaker = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# The services a caller's own identity is made with: the authorization suite creates roles
# with IAM's own operations and assumes them through STS, so the identity-based documents the
# gate reads are the ones those services wrote.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }

[lints]
workspace = true
