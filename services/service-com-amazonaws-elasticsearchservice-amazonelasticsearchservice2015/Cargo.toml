[package]
name = "service-com-amazonaws-elasticsearchservice-amazonelasticsearchservice2015"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque, stable per-domain suffix for a generated search endpoint.
sha2 = { workspace = true }
hex = { workspace = true }
# The fleet's home for how a boundary refusal is worded (`override_refusal`).
service-common = { path = "../common" }
# The OpenSearch Service surface of this SAME service (the 2021-01-01 API): a domain is one
# resource published through two API versions, so this surface's reads resolve a domain in
# the store that surface's own `CreateDomain` writes as well as in this one
# (`state::opensearch_surface`) — the way every other service crate reaches a store that is
# not its own.
service-com-amazonaws-opensearch-amazonopensearchservice = { workspace = true }
# Checks a value against the syntax a shape declares, for the constraints the
# boundary walk cannot reach (a map key, a shape this model leaves unconstrained).
regex = "1.13"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Declares one module per `tests/all/<name>.rs`, so the integration-test target needs no
# hand-maintained list of suites.
automod = { workspace = true }
# `time` is a test-only need: the lifecycle suite awaits the provisioning span.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
