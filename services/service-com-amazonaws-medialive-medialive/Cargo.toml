[package]
name = "service-com-amazonaws-medialive-medialive"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# Calendar arithmetic for a reservation's lease: the first day of the current
# month and the months a term runs for (`src/state/reservations.rs`).
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Hex encoding, for the lowercase-hex request id a response reports when it carries
# none of its own (`src/service/error_envelope.rs`).
hex = { workspace = true }
# SHA-256: mixes a per-process counter and the current instant into that request id.
sha2 = { workspace = true }
smithy-macros = { workspace = true }
# Resolves the `RoleArn` a channel write names against this account's IAM, over
# the emulator's own in-process transport, before the channel is stored
# (`src/ops/create_channel.rs`, `src/ops/update_channel.rs`).
service-common = { path = "../common" }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Declares one module per `tests/all/<name>.rs` suite, so the single integration
# test target at `tests/all/main.rs` picks a new suite up with nothing to declare.
automod = { workspace = true }
# `time` for the one case that lets the clock move between two failures.
tokio = { workspace = true, features = ["time"] }
# The role suite mounts IAM beside MediaLive on one engine, because a channel
# create resolves its `RoleArn` by calling IAM, and drives IAM through its own
# SDK client over the router's in-process callback.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
aws-sdk-iam = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The same calendar arithmetic the reservation slice uses, so a test computes a
# lease's window and its end with the library rather than its own month table.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Percent-encodes the URI path labels the group suite's reads carry, rather than
# carrying a second hand-written encoder. Pinned here rather than through
# `[workspace.dependencies]` because the root manifest is not editable from a
# service crate.
percent-encoding = "2"

[lints]
workspace = true
