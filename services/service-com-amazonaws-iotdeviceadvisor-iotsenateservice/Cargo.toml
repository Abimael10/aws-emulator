[package]
name = "service-com-amazonaws-iotdeviceadvisor-iotsenateservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Used in `src/state/endpoint_addressing.rs`: the one reading of which address this emulator
# is served at, and of the DNS zone it may announce a host of its own in, which the endpoint
# this service reports is rooted in.
service-common = { path = "../common" }
# `sha2` is declared only to keep the committed Cargo.lock valid for the `--locked` builds
# this workspace runs: nothing in this crate reaches it since the endpoint this service
# reports became the address this emulator answers on, which carries no derived label.
sha2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
# The suites that read the audit capture back share one process-wide buffer, so they
# serialize on an async-aware lock held across awaits (`tests/all/audit_trail.rs`).
tokio = { workspace = true, features = ["sync"] }

[lints]
workspace = true
