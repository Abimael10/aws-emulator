[package]
name = "service-com-amazonaws-emrserverless-awstoledowebservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# The cross-service rules this service takes: the framing of a 204 answer that carries no
# content, and the status such an answer carries.
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["time", "sync"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hex codec for the opaque `ListApplications` / `ListJobRuns` pagination cursors.
hex = { workspace = true }
# Digests the rendered `CreateApplication` request behind the idempotency-token
# fingerprint, and the grant behind a `GetDashboardForJobRun` URL's token.
sha2 = { workspace = true }
# The Amazon S3 client a finished job run's log artifacts are PUBLISHED through, over the
# in-process callback into this same emulator (the client itself is `service-common`'s one
# builder; this is the `ByteStream` the object's bytes are handed over as). No network
# client feature is enabled: the transport is the emulator's own.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# A published log artifact IS a gzip stream, so it is framed with the maintained DEFLATE
# implementation this workspace already compresses with rather than by hand.
flate2 = "1"
# The `s3MonitoringConfiguration.logUri` a client configures log publishing with is a
# caller-supplied URI, read by the maintained URL parser rather than split by hand.
url = "2"
# ... and that URI's path spells an Amazon S3 key prefix, whose percent-escaping is
# resolved by the maintained encoder the URL parser itself uses.
percent-encoding = "2"
# The CONTAINED Python interpreter a job run's submitted Spark application is executed by,
# and the AWS SDK modules that interpreter puts on the application's import path — both
# reached through the Lambda service crate, which is where this workspace's ONE embedded
# Python execution substrate lives (`state::execution::python`). Reused rather than stood up
# a second time here, so a submitted application runs under exactly the containment and the
# bounds that engine already enforces, and this crate adds no execution surface of its own:
# it supplies the application's source, its command line and its ceilings
# (`crate::state::spark_job_run`) and nothing else.
#
# Capability class: an execution substrate. What it re-opens is answered by that engine and
# by this crate's own module docs — the interpreter is built with the engine crate's
# host-reaching features compiled out, its native modules are an allow-list that leaves
# every socket, subprocess, memory-map and host-library module unregistered, the
# operating-system modules an application can import are the workspace's own in-memory ones,
# and every bound (wall clock, steps, memory, recursion, output size) lives in host code no
# application can reach.
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }
# `JobRun$releaseLabel` is "The Amazon EMR release associated with the application your job
# is running on", so the version of Spark a run's application is told it runs on is that
# Amazon EMR release's own — read from the release catalog Amazon EMR's own service crate
# publishes for `DescribeReleaseLabel` rather than kept a second time here.
service-com-amazonaws-emr-elasticmapreduce = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The log-publication suite mounts Amazon S3 beside this service on ONE engine, because a
# finished job run publishes its log artifacts there — what the assembled emulator does —
# and reads them back through the object store's own `ListObjectsV2` / `GetObject`.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# ... and CloudWatch Logs beside it, for the other destination a monitoring configuration
# names: the suite reads the delivered records back through `GetLogEvents`.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }

[lints]
workspace = true
