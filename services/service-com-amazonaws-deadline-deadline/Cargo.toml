[package]
name = "service-com-amazonaws-deadline-deadline"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# The workspace's one home for the `date-time` timestamp wire form every restJson1
# service of this class shares (`service_common::date_time_json`).
service-common = { path = "../common" }
# The account's session registry and its view of the account's IAM records: the one
# resolution of WHICH PRINCIPAL an access key id speaks for, which is what this service's
# `createdBy`/`updatedBy` members report (`crate::state::caller_principal`).
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Mints the 32-hex-character resource ids the farm/queue/job label patterns require.
sha2 = { workspace = true }
hex = { workspace = true }
# Reads the name out of a caller-supplied job or environment template written in YAML (the
# other of the two languages `JobTemplateType` / `EnvironmentTemplateType` spell, beside
# the JSON `serde_json` reads); yaml-rust2 is the pure-Rust YAML 1.2 implementation the
# other services that read caller-supplied YAML in this workspace use.
yaml-rust2 = { version = "0.10", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Declares one module per `tests/all/<name>.rs`, so the crate's one integration-test
# target needs no hand-written list of its suites.
automod = { workspace = true }
# RFC 3986 percent-encoding, which is what an AWS SDK applies to a NON-greedy
# `@httpLabel`: the tagging suite puts a whole ARN in the single path segment
# `/2023-10-12/tags/{resourceArn}` is, rather than escaping it by hand.
percent-encoding = "2.3"
# The account's IAM records, for the one suite that arranges the user an access key is held
# for — the record this service's `createdBy` resolution reads a long-term key against.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# `time` on top of the workspace features, for the one TEST that has to let the clock pass
# a job's CREATE_IN_PROGRESS -> CREATE_COMPLETE due instant without blocking the runtime.
# A dev-dependency, so the service's own build keeps the workspace feature set.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
