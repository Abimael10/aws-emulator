[package]
name = "service-com-amazonaws-identitystore-awsidentitystore"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# The STS session registry and its resolution of a request's caller, so the principal a
# resource records as its `CreatedBy`/`UpdatedBy` is the identity
# `sts:GetCallerIdentity` reports for the credential the request was signed with
# (see `crate::state::caller_principal`).
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# IAM Identity Center's own instance records: an identity store is the store OF an
# Identity Center instance and is not creatable through this API, so which stores this
# account has is asked of that service rather than decided here
# (see `crate::state::identity_center`).
service-com-amazonaws-ssoadmin-swbexternalservice = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque list-pagination cursors: the membership id, hex-encoded.
hex = { workspace = true }
# The mixing step behind minted UUID resource ids.
sha2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
