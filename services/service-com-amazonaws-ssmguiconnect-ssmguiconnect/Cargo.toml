[package]
name = "service-com-amazonaws-ssmguiconnect-ssmguiconnect"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `query_error_envelope`: the shared report of the request id a response names the
# request it answers by, so this service's restJson1 envelope carries it the way every
# other emulated service's does. `iam_authorization`: the one evaluation of IAM policy
# documents against an action on a resource, which decides every call of this service.
service-common = { path = "../common" }
# The STS store, for the identity an access key id speaks for: the principal
# `sts:GetCallerIdentity` answers for the credentials a request signed with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The IAM store, for the identity-based policy documents in force on that principal,
# which decide whether the caller may perform the action an operation asks for.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The Systems Manager store, for whether the account is enrolled in just-in-time node
# access in the Region a request was signed for: the access-request approval policy that
# enrollment consists of is a document THAT service holds, read through its own accessor
# rather than from a second copy of the answer here (`state::just_in_time_node_access`).
service-com-amazonaws-ssm-amazonssm = { workspace = true }

# Everything else this service needs — the `@pattern` sub-checks, the
# `@idempotencyToken` mint and the test's audit capture — is built on the standard
# library and on `tracing`, which the scaffold already declares.

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
