[package]
name = "service-com-amazonaws-mediaconvert-mediaconvert"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# Opaque pagination tokens: hex-encode the cursor so it is not readable client state.
hex = { workspace = true }
# SHA-256: derives the `x-amzn-requestid` this service stamps an error response with
# (`src/service/error_envelope.rs`), from a per-process counter and the current instant.
sha2 = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `eventbridge_client`: the ONE in-process EventBridge client an emulated service
# publishes an event through, so this crate configures no second copy of that hop.
service-common = { path = "../common" }
# The AWS SDK for EventBridge, driven over the in-process callback
# (`OperationContext::callback`): MediaConvert publishes a `MediaConvert Job State
# Change` event onto the account's default event bus as a job moves through its
# statuses (`state::job_events`). Only the generated client is needed — the emulator
# supplies the transport, so the SDK's own HTTPS stack is left out.
aws-sdk-eventbridge = { version = "1", default-features = false }
# The AWS SDK for Certificate Manager, driven over the same in-process callback: the
# certificate `AssociateCertificate` names is that service's resource, so the handler
# resolves it against the service that OWNS it (`src/state/acm_certificates.rs`) rather
# than assuming a well-formed ARN names one. Only the generated client is needed — the
# emulator supplies the transport, so the SDK's own HTTPS stack is left out.
aws-sdk-acm = { version = "1", default-features = false, features = [
    # As for the S3 client below: `BehaviorVersion::latest()` is gated behind the first
    # feature and the callback transport is driven on the Tokio runtime, so a
    # `cargo build -p` of this crate alone resolves both.
    "behavior-version-latest",
    "rt-tokio",
] }
# The AWS SDK for S3, driven over the in-process callback
# (`OperationContext::callback`): `CreateJob` probes each of a job's
# `Settings.Inputs[].FileInput` S3 locations with `HeadObject` before the job is
# accepted, so a job that fails because an input cannot be opened is classified
# from what S3 actually answered. Only the generated client is needed — the
# emulator supplies the transport, so the SDK's own HTTPS stack is left out.
aws-sdk-s3 = { version = "1", default-features = false, features = [
    # `BehaviorVersion::latest()` in `state.rs` is gated behind this feature, and the
    # Tokio runtime is what the callback transport is driven on — spelled out here, as
    # the sibling crates that build the same in-process client do, so a
    # `cargo build -p` of this crate alone resolves them too.
    "behavior-version-latest",
    "rt-tokio",
] }

# The ISO base media demuxer `Probe` reads an MP4, QuickTime, 3GP or 3G2 file's movie
# header and tracks with, so the container, the track layout and each track's geometry
# are read off the caller's own bytes rather than assumed.
mp4 = "0.14"
# The RIFF/WAVE reader `Probe` reads a Wave file's format chunk with (sample rate,
# channel count, bit depth, frame count), for the same reason.
hound = "3.5"
# The H.264 codec a job's run really CODES video with when the job asks this service to
# GENERATE its input (`Input$VideoGenerator`, "MediaConvert creates a video input with
# black frames"): there is no essence to carry over for such a job, so the frames are
# encoded here and muxed into the output file through the workspace's one H.264/MP4 framing
# seam (`service_common::h264_mp4`). `openh264` is a NATIVE component: its `-sys` crate
# compiles the bundled Cisco C++ sources with `cc` at build time, as the Amazon IoT
# SiteWise and Amazon Bedrock Runtime crates already take this same codec for their
# rendered video, and it is a library computing over frames in-process — it opens no
# listener, starts no process, reads no file and makes no outbound connection. The work one
# job can ask of it is bounded before any of it starts (`MAX_GENERATED_FRAMES`,
# `MAX_GENERATED_FRAME_PIXELS`, `MAX_GENERATED_PIXELS`) and runs on the blocking pool.
openh264 = "0.9"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
# `time` for the one integration case that waits past a job's settle instant.
tokio = { workspace = true, features = ["time"] }
# EventBridge and SQS are mounted beside MediaConvert on one engine in the integration
# tests, because MediaConvert publishes a `MediaConvert Job State Change` event onto the
# default event bus as a job moves and a rule on that bus delivers it to an SQS queue:
# without them mounted there is nothing for the publication to reach.
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
# S3 is mounted beside MediaConvert on one engine in the `Probe` integration tests: the
# operation reads the media file the request addresses out of S3 over the in-process
# callback, so without an S3 holding the object there is nothing for it to read.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# Certificate Manager is mounted beside MediaConvert on one engine in the certificate
# tests: `AssociateCertificate` resolves the ARN it is given against the service that owns
# the certificate, so without an ACM holding one there is nothing for it to resolve.
service-com-amazonaws-acm-certificatemanager = { workspace = true }

[lints]
workspace = true
