[package]
name = "service-com-amazonaws-s3files-s3files"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hashing for the unique ids this service mints (file-system ids, access-point ids and
# the client token a create records when the caller sent none).
sha2 = { workspace = true }
# Hex codec for those ids and for the opaque `nextToken` the listings issue.
hex = { workspace = true }
# The AWS SDK for S3, driven over the in-process callback
# (`OperationContext::callback`) the way `scheduler` drives the IAM SDK:
# `CreateFileSystem` resolves the bucket its `bucket` ARN names with `HeadBucket` before
# it persists a file system. Only the generated client is needed — the emulator supplies
# the transport and the credentials, so the SDK's own HTTPS stack and runtime are left
# out.
aws-sdk-s3 = { version = "1", default-features = false }
# The AWS SDK for EC2, driven over the same in-process callback: the subnet a
# `CreateMountTarget` places a mount target in — and that subnet's VPC, Availability Zone,
# address range and default security group — are EC2's resources, so
# `src/state/ec2_network.rs` asks EC2 what the account has rather than deciding it here.
aws-sdk-ec2 = { version = "1", default-features = false }
# `ipnet`: the ONE reading of a subnet's CIDR block — which addresses it can assign to a
# mount target's network interface, and whether an address a request named lies inside it.
ipnet = "2"
# `arn::region_label`: the ONE reading of a caller-supplied Region as a Region LABEL, which
# is what the endpoint the EC2 call above is made at is built from. Beside it,
# `posix_shell_volume` (the tree a mounted file system holds) and `web_media_type` (the media
# type a file's own name states), which the native data plane in `src/state/file_data.rs` is
# built on.
service-common = { path = "../common" }
# The object store a file system is a view of: a file written through a mount IS an object of
# the backing bucket, so the write-through records it in that service's own store on the
# shared engine (`src/state/file_data.rs`) rather than in a second copy of it here.
service-com-amazonaws-s3-amazons3 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# One module per `tests/all/<name>.rs`, so a new suite is a new file: this crate's tests are
# the single `all` target rooted at `tests/all/main.rs`.
automod = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# The EC2 service, mounted beside this one in the mount-target test harness: that a mount
# target is placed in a subnet the account really has can only be driven end to end with
# the owner of subnets on the same engine. DEV-ONLY: this crate depends on no other
# service's crate outside its tests.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }

[lints]
workspace = true
