[package]
name = "service-com-amazonaws-drs-elasticdisasterrecoveryservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The AWS SDK for EC2, driven over the in-process callback
# (`OperationContext::callback`): the account's subnets are EC2's resources, so a call
# that stores a caller-named replication staging area resolves its subnet against EC2
# (`src/state/ec2_subnets.rs`) before it stores anything. Only the generated client is
# needed — the emulator supplies the transport.
aws-sdk-ec2 = { version = "1", default-features = false }
# The tree's shared reading of a Region label, used before a caller-supplied Region
# reaches an endpoint URL's authority.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Declares tests/all/main.rs's suite modules, one per tests/all/<name>.rs.
automod = { workspace = true }
# Percent-encodes a tag key into a query value the way a client does, so a test can send
# a key holding reserved or non-ASCII characters without hand-rolling the escaping.
percent-encoding = "2"
sha2 = { workspace = true }
# Shipped by the scaffold; left declared so this crate's Cargo.lock entry stays
# exactly the generated one.
hex = { workspace = true }
# The owner of the resource this service RESOLVES, mounted beside it in a test:
# Amazon EC2 holds the account's subnets, so the staging-area resolution a create and
# an update perform can only be driven end to end with EC2 on the same engine.
# DEV-ONLY: this crate depends on no other service's crate outside its tests.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }

[lints]
workspace = true
