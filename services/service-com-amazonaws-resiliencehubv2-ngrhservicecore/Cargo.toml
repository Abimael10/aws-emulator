[package]
name = "service-com-amazonaws-resiliencehubv2-ngrhservicecore"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `validation_message`: the bracketed schema-finding report this service states for a
# request value one of the rules its request schema declares refused, over the sentences
# every service stating that layer's findings shares.
service-common = { path = "../common" }
# The account's IAM records, read through the IAM service's own state struct in the SAME
# shared engine: `permissionModel.invokerRoleName` names a role this service has to be able
# to assume, so `CreateService` and `UpdateService` resolve it before they write.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# CloudFormation's own read of a stack's resources, made IN-PROCESS over `ctx.callback()`:
# a `cfnStackArn` input source discovers the resources of that stack, and only the service
# that owns them can say which they are.
aws-sdk-cloudformation = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# SHA-256 for the UUID-shaped resource id of a minted service ARN.
sha2 = { workspace = true }
# Hex for that id's canonical rendering and for the opaque `ListServices` page token.
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
