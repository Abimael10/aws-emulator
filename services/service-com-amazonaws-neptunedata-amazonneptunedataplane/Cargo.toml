[package]
name = "service-com-amazonaws-neptunedata-amazonneptunedataplane"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `graph_db_clusters`: the shared directory the Neptune control plane records a provisioned
# cluster's engine version and feature configuration in, which this data plane's engine
# status reports on. `response_media_type`: the media type this service announces.
service-common = { path = "../common" }
# The lexer the Gremlin explain endpoint reads a submitted traversal with: its token
# definitions live beside the recursive descent in `src/state/gremlin_plan.rs`.
logos = "0.16"
# The UUID the fast-reset token is: `ExecuteFastReset`'s initiate step hands back a v4 UUID.
uuid = { version = "1", features = ["v4"] }
# `opencypher`: the openCypher query text the openCypher endpoints take is LEXED and
# PARSED with it into the crate's own typed AST, so a malformed query is refused by a
# real openCypher parser and a well-formed one is evaluated from that AST rather than
# from its source text. A LIBRARY that computes over data in process: it parses and
# executes nothing ("it does not execute queries" — its own documentation), opens no
# socket, reads no file, declares no FFI and ships no native code; its one build-time
# step is the `logos` derive macro its lexer is generated with. The evaluation of the
# AST, and every bound on what one query may spend, are this crate's own
# (`src/state/open_cypher.rs`), through the `Executor` trait the crate documents as the
# contract for running a parsed query against a consumer's own store. Chosen over
# `cypher-parser`, whose own executor covers reading clauses only (its documentation
# states write clauses are "intentionally not supported"), because this endpoint has to
# serve CREATE, MERGE, SET, REMOVE and DELETE as well as MATCH.
opencypher = "0.1.4"
# `regex`: openCypher's `=~` operator takes a regular expression FROM THE QUERY, so it
# is matched with a real engine rather than a hand-rolled matcher. Linear-time by
# construction (no backtracking), and the program one pattern may compile to is capped
# before it is built (`MAX_REGEX_PROGRAM_BYTES`).
regex = "1"
# `time`: the engine status states an instant in a calendar form carrying the weekday and
# the month by name, which a real calendar library renders — no date arithmetic of this
# crate's own. A LIBRARY that computes over data in process: formatting only, with
# `default-features = false` so no parsing, no clock and no local-time-zone lookup is
# compiled in; it opens no socket, reads no file and declares no FFI. Its one build-time
# step is the `time-macros` proc macro the format description is written with, which runs
# on the builder's machine like every other derive in this crate.
time = { version = "0.3", default-features = false, features = ["std", "macros", "formatting"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
