[package]
name = "service-com-amazonaws-kinesisvideoarchivedmedia-awsacuityreader"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `validation_message`: the shared wording of a framework-level constraint refusal —
# AWS's envelope, its clauses, and the element constraint set a collection member's
# clause states — so this service's `override_refusal` chooses the rendering rather
# than re-implementing it. `iam_authorization`: the one evaluation of IAM policy
# documents against an action on a resource, which decides every read of this plane.
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The Kinesis Video Streams control plane's own store: `CreateStream` is what creates
# the streams this read plane serves, so a stream's existence, ARN and current
# retention are read from that state in the shared engine rather than kept a second
# time here.
service-com-amazonaws-kinesisvideo-kinesisvideo-20170930 = { workspace = true }
# The STS store, for the identity an access key id speaks for: the principal
# `sts:GetCallerIdentity` answers for the credentials a request signed with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The IAM store, for the identity-based policy documents in force on that principal, which
# decide whether the caller may perform the action a read asks for.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# Decodes the frame a fragment's archived bytes carry and re-encodes it in the format
# `GetImages` was asked for (PNG, JPEG, at a requested size and JPEG quality).
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
] }
# Reads the Matroska (MKV) container a fragment is archived as — the element tree, its
# variable-size integers and the block header one frame carries — so `GetClip` muxes the
# tracks and frames the archive really holds. The same maintained reader the ingest plane
# reads a submitted container with.
webm-iterable = "0.7"
# Reads the sequence parameter set of a track's AVC decoder configuration record, which is
# what states the coded geometry the clip's video track declares.
h264-reader = "0.9"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# The suites' archived fragments carry REAL H.264: the fixture encodes its pictures with
# the same maintained codec the other video services in this workspace render with, so the
# access units, the sequence parameter set and the picture parameter set the clip is muxed
# from are a codec's own rather than bytes shaped to look like one.
#
# DEV-ONLY, and NATIVE: its `-sys` crate compiles the bundled Cisco C++ sources with `cc`
# at build time (as `aws-lc-sys` already does here, and as the Amazon Bedrock Runtime and
# IoT SiteWise crates already take this codec), and it is a library computing over frames
# in-process — it opens no listener, starts no process, reads no file and makes no outbound
# connection. Nothing this crate SHIPS depends on it: the served code reads the parameter
# sets a producer ingested and never encodes a picture.
openh264 = "0.9"
# Reads the MP4 clip back through a maintained ISO base media reader, so what a suite
# asserts about the container is what a client's demuxer sees.
mp4 = "0.14"
# `time`: the suites wait for a control-plane stream to become readable by looking
# again in a poll loop, which needs a timer between looks.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
