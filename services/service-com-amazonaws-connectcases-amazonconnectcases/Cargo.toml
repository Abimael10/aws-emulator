[package]
name = "service-com-amazonaws-connectcases-amazonconnectcases"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The digest and hex codec the opaque domain/field/template/case ids are minted
# from: SHA-256 over this process's OS-seeded entropy, an atomic mint counter and
# the mint instant, rendered in the textual UUID form the service's ids take
# (see `state::new_id`). Same pair the sibling service crates mint ids with.
sha2 = { workspace = true }
hex = { workspace = true }
# `arn`: the ONE reading of a caller-supplied resource ARN — its six fields and the
# vendor namespace that says whose resource it names — which the tagging operations
# resolve an `Arn` with, so this service does not disagree with any other about what
# an ARN is (see `state::tags`).
service-common = { path = "../common" }

[dev-dependencies]
# Declares one module per `tests/all/<name>.rs`, so the integration-test target
# picks a new suite up as a new file and nothing else.
automod = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
