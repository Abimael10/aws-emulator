[package]
name = "service-com-amazonaws-pinpointsmsvoicev2-pinpointsmsvoicev2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The one claim rule for a service whose SigV4 signing name is shared with another
# emulated service (here Pinpoint SMS Voice V1).
service-common = { path = "../common" }
# The published ISO 3166-1 country table: which two-letter codes are country codes, and
# the whole set of them a protect configuration's country rule set covers.
rust_iso3166 = "0.2"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Declares one module per `tests/all/<name>.rs`, so a suite needs no hand-written `mod`.
automod = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
