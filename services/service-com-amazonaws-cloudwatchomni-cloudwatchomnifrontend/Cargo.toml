[package]
name = "service-com-amazonaws-cloudwatchomni-cloudwatchomnifrontend"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Decodes the hex of a minted UUID, and encodes/decodes the opaque `nextToken`
# pagination cursor ListSpaces hands back.
hex = { workspace = true }
# `sqlparser`: a view's `definition` is a SQL query, so it is PARSED with it rather than
# inspected as text — see `state::view_definition`.
sqlparser = "0.59"
# `url`: a `redirectUrl` a deep-link request carries is PARSED with it rather than split as
# text, so its scheme, origin, path, query and fragment are read the way a browser reads
# them — see `state::deep_link`.
url = "2"
# `sha2`: a one-time deep-link code is recorded as its SHA-256 digest, never as the code —
# see `state::deep_link`.
sha2 = { workspace = true }
# `service-common` carries the workspace's ONE wording of a constraint-violation refusal —
# the clause, the envelope, the `@pattern` rendering and the order an enumerated type's
# value set is listed in — which `service::validation` delegates to.
service-common = { path = "../common" }
# The IAM Identity Center identity store `SearchPrincipals` searches, read through the same
# shared engine: the users and groups a search reports are the ones `CreateUser` and
# `CreateGroup` wrote in the service that OWNS them, not a second copy kept here.
service-com-amazonaws-identitystore-awsidentitystore = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Declares one module per `tests/all/<name>.rs`, so a new suite needs no declaration.
automod = { workspace = true }
hex = { workspace = true }
# Decodes the rpcv2Cbor error envelope a test reads a refusal's message out of.
aws-smithy-cbor = "0.62.2"

[lints]
workspace = true
