[package]
name = "service-com-amazonaws-redshiftserverless-redshiftserverless"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Server-minted resource ids (`namespaceId` / `workgroupId`) are v4 UUIDs.
uuid = { version = "1", features = ["v4"] }
# Opaque pagination tokens: the resume key, hex-encoded.
hex = { workspace = true }
# A Redshift Serverless namespace's DATA — its databases and the tables in them —
# lives in the SQL engine the Redshift Data API runs statements on, which addresses
# it by workgroup. `CreateSnapshot` ("creates a snapshot of all databases in a
# namespace") and `RestoreFromSnapshot` have to copy those databases, so this crate
# takes the capture through that crate's `state::capture_warehouse` /
# `state::restore_warehouse` seam rather than keeping a second copy of the data or
# reporting a restore nothing moved. The capture is opaque here: no SQL type crosses
# the boundary, and the dependency points one way (the Data API crate does not
# depend on this one).
service-com-amazonaws-redshiftdata-redshiftdata = { workspace = true }
# `service-common` carries the workspace's ONE reading of a caller-supplied Region
# label, which the Amazon EC2 hop below names the peer service's endpoint with.
service-common = { path = "../common" }
# The Amazon EC2 client a workgroup's managed VPC endpoint is created, read back and
# deleted through, over the emulator's in-process callback: `Endpoint$vpcEndpoints` is a
# VPC endpoint with one network interface per subnet, and a VPC endpoint, a subnet and a
# network interface are all EC2's resources (`state::managed_vpc_endpoint`).
aws-sdk-ec2 = { version = "1", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `tests/all/main.rs` declares one suite module per `tests/all/<name>.rs`, so a new suite is a
# new file and nothing lists it.
automod = { workspace = true }
sha2 = { workspace = true }
# The workgroup-endpoint suite mounts Amazon EC2 beside Redshift Serverless on one engine,
# because the VPC, the subnets and the endpoint network interfaces a workgroup's managed VPC
# endpoint is made of are ITS resources: the suite builds the network through that service's
# own API and reads the interfaces back from it. A workspace member this repository already
# locks.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }

[lints]
workspace = true
