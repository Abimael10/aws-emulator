[package]
name = "service-com-amazonaws-supplychain-galaxypublicapigateway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `service-common` carries two readers the tagging operations' authorization gate
# (`src/service/authorization.rs`) needs: `iam_authorization`, the shared evaluation of IAM
# policy documents against an action on a resource and the shared wording of the refusal,
# and `iam_role`, which IAM entity a principal ARN names.
service-common = { path = "../common" }
# The STS store, for the identity an access key id speaks for: the principal
# `sts:GetCallerIdentity` answers for the credentials a request signed with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The IAM store, for the identity-based policy documents in force on that principal.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes the opaque `nextToken` the paginated listings page with.
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# RFC 3986 percent-encoding, so the tagging suite can put a tag key carrying a space or a
# query separator in the `tagKeys` query parameter the way an SDK does, rather than
# hand-rolling an escape.
percent-encoding = "2.3"
# `tokio::time::sleep` lets the tests wait out the clock-owed instance transition; no
# handler sleeps, so the feature stays out of the production build.
tokio = { workspace = true, features = ["time"] }
# Mounted BESIDE this one in `tests/all/`: the IAM and STS services, whose stores hold the
# role, its policies and the session the tagging operations' authorization gate reads.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }

[lints]
workspace = true
