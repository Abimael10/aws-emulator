[package]
name = "service-com-amazonaws-codestarnotifications-codestarnotifications-20191015"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hashing (idempotency fingerprints) and hex (opaque page tokens).
sha2 = { workspace = true }
hex = { workspace = true }
# The random bytes the rule ids this service mints are drawn from, and the seeded
# generator the property-based identity suite draws its rule populations from.
rand = "0.9"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# Percent-encoding for the `@httpLabel` / `@httpQuery` values a test puts on the request
# line (an ARN's `:` and `/` have to travel escaped).
percent-encoding = "2"

[lints]
workspace = true
