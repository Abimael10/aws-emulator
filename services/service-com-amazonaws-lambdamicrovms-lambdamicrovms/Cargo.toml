[package]
name = "service-com-amazonaws-lambdamicrovms-lambdamicrovms"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share.
service-common = { path = "../common" }
# The CONTAINED Python interpreter this emulator runs caller-supplied Python in, shared with
# the service that runs a function's own handler: the interpreter's construction, its
# native-module narrowing, the containment patches the host reads back, and the readings a
# run's memory bound is judged on all live there, so a MicroVM guest and a Lambda handler are
# contained by one implementation rather than by a copy each (`src/state/guest_python.rs`).
python-guest-substrate = { path = "../python-guest-substrate" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes/decodes the opaque `nextToken` ListMicrovms pages with, and renders the
# digest a MicroVM endpoint recognises an authentication token by.
hex = { workspace = true }
# Digests a MicroVM endpoint authentication token, so the store holds no token secret,
# and the opaque bytes a minted MicroVM image `id` is rendered from.
sha2 = { workspace = true }
# The AWS SDK for Amazon S3, driven over the in-process callback
# (`OperationContext::callback`): a MicroVM image version's `codeArtifact` is an object of
# the emulator's own object store, so `src/state/code_artifact.rs` asks Amazon S3 whether
# it serves that artifact rather than deciding the build's outcome here. Only the
# generated client is needed — the emulator supplies the transport.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The AWS SDK for Amazon EC2, driven over the same in-process callback: the network a
# MicroVM's egress connector places it in is EC2's (subnets, endpoint network interfaces
# and security groups), so `src/state/microvm_network.rs` ASKS EC2 for it — the contract
# `service_common::network` states — rather than holding a second answer of its own.
aws-sdk-ec2 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The lambda-core store in the SAME shared engine, for the network connectors a MicroVM
# names in `egressNetworkConnectors`: that service owns them and publishes no SDK client,
# so its own records are read through the engine both services live in — the seam
# `service-com-amazonaws-lambda-awsgirapiservice` reads Amazon ECR's images through.
service-com-amazonaws-lambdacore-lambdacoreapiservice = { workspace = true }
# Amazon EC2, for the ONE reading of what a STATIC server answers for a request
# (`state::guest_services::served_from`): a MicroVM whose image's command starts the
# interpreter's own HTTP file-server module runs that server over the MicroVM's own
# filesystem (`src/state/guest_file_server.rs`), and an Amazon EC2 instance's own static
# server is answered through that same reading — so the two cannot drift apart. It is
# mounted beside this service in the guest data-plane harness as well, where the subnet,
# the destination interface and the security groups it holds are what decide a MicroVM's
# outbound connection.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
# Renders the calendar hour a MicroVM image version's state settled in, which is what the
# recorded `versionStateTimeBucket` names (`src/state.rs`): no calendar arithmetic is
# hand-written here.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Reads an IPv4 prefix (a subnet's CIDR, a security-group rule's range) and answers
# whether one contains an address or another prefix, so no address arithmetic is
# hand-written here.
ipnet = "2"
# Reads the entries of the .zip a MicroVM image's code artifact is packaged as, entirely
# in memory. Only the stored and deflated entry forms are read; nothing is extracted to a
# host path.
zip = { version = "9", default-features = false, features = ["deflate"] }
# `rquickjs` is the QuickJS JavaScript engine, embedded in this process: it is the
# EXECUTION SUBSTRATE that RUNS a MicroVM guest's own code, so the response a client reads
# from a MicroVM's endpoint is the one the guest's program produced
# (`src/state/guest_runtime.rs`).
#
# * the "dyn-load" feature is NOT enabled, so QuickJS registers no dynamic host-library
#   loader; no "loader" feature either, so an `import` resolves to nothing and the only
#   modules a guest reaches are the ones this crate implements for it;
# * plain QuickJS registers no filesystem, process, environment, socket or thread API. The
#   `fs`, `process` and `os` a guest reaches are this crate's own and are the MICROVM's,
#   never this machine's: `fs` reads and writes only the in-memory tree the MicroVM holds
#   (`src/state/guest_machine.rs`, bounded by its own volume limits) and opens no host
#   path, `process` and `os` report the identity and the environment the MicroVM published
#   to the guest and nothing of the process this emulator runs in, and the guest's only
#   host functions are this crate's request, connect, machine and log seams, each removed
#   from the global object before the guest's code is compiled. No child-process,
#   host-library or thread module is registered at all;
# * it is also a NATIVE component: `rquickjs-sys` compiles the QuickJS C sources with `cc`
#   at build time and the bindings are `unsafe`. That is accepted because the engine is
#   what makes a guest's code run at all, and it is the engine four other service crates of
#   this workspace already embed for the same purpose;
# * no advisory is open against the 0.14 line (`cargo_audit` at the merge gate reads the
#   locked tree).
rquickjs = "0.14"
# The PYTHON half of the same execution substrate: an image whose container specification
# starts `python3` on a module holds a Python guest, so the response a client reads from that
# MicroVM's endpoint has to be the one that program produced (`src/state/guest_python.rs`).
# RustPython interprets it IN THIS PROCESS, and every crate here is taken with its
# host-reaching surface switched off at compile time, so the capability class is "run the
# MicroVM image's own Python in this process, with no host access at all":
#
# * `rustpython-vm` with `default-features = false` leaves `host_env`, `stdio` and
#   `threading` out of the build, so the interpreter registers no `_ctypes` host loader,
#   writes nothing to this process's standard streams and starts no interpreter thread;
#   `compiler` is the bytecode compiler for the image's own modules.
# * `rustpython-stdlib` with `default-features = false` is the NATIVE-MODULE POOL, and it is
#   never registered wholesale: `guest_python::ALLOWED_NATIVE_MODULES` filters
#   `stdlib_module_defs`, so `_socket`, `_ssl`, `select`, `_posixsubprocess`, `mmap`,
#   `_ctypes`, `fcntl`, `_signal` and `posix` are never registered and are therefore
#   reachable through no import, and the modules a program expects of its operating system
#   (`posix`, `socket`, `socketserver`, `select`) are this crate's own, which reach the
#   MicroVM's in-memory machine and the emulated network and nothing else.
# * `rustpython-pylib` with `freeze-stdlib` is the Python standard library, FROZEN into this
#   binary: no host path is searched for a module.
# * `rustpython-ruff_*` are RustPython's own forks of the Python parser's AST crates, PINNED
#   exactly: `rustpython-codegen` 0.6 is built against the 0.16.5 AST and 0.16.10 renamed
#   fields it uses, so an unpinned resolution picks a newer 0.16.x and fails to compile.
# * `nix` (`resource` only) reads this process's own resource usage — the guest thread's
#   faulted pages — which is how a run is bounded in MEMORY: RustPython exposes no allocator
#   seam, so the bound is sampled from outside the guest, and a per-thread reading is the
#   only one that belongs to one guest. It compiles no C.
#
# Native and unsafe surface accepted here: the RustPython tree uses `unsafe` for its object
# model and its frozen-module tables, and its arithmetic dependencies compile Rust only. No
# crate in this set compiles a C toolchain dependency, loads a shared library, or opens a
# socket, a process or a host file. Advisories considered: RUSTSEC-2026-0394 (RustPython up
# to 0.5, fixed in the 0.6 line taken here) and the `atty` advisory the 0.3/0.4 lines pull in
# (not reachable from 0.6).
rustpython-vm = { version = "0.6", default-features = false, features = [
    "compiler",
] }
rustpython-stdlib = { version = "0.6", default-features = false }
rustpython-pylib = { version = "0.6", features = ["freeze-stdlib"] }
rustpython-ruff_python_ast = "=0.16.5"
rustpython-ruff_python_parser = "=0.16.5"
rustpython-ruff_python_trivia = "=0.16.5"
rustpython-ruff_source_file = "=0.16.5"
rustpython-ruff_text_size = "=0.16.5"
nix = { version = "0.31", default-features = false, features = ["resource"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Declares one module per `tests/all/<name>.rs`, so this crate's suites are one test
# target rooted at `tests/all/main.rs` and a new suite needs no declaration.
automod = { workspace = true }
# Builds the opaque `nextToken` candidates the pagination suites hand back.
hex = { workspace = true }
# Packages the .zip code artifact the guest suites stage, so a guest program reaches the
# build through exactly the archive form a client would upload.
zip = { version = "9", default-features = false, features = ["deflate"] }
# `tokio::time::sleep` for the clock-owed transitions the tests wait out.
tokio = { workspace = true, features = ["time"] }
# Amazon S3, mounted beside this service in the build-outcome harness: that a build
# settles on the failure branch exactly when the object store does not serve its code
# artifact can only be driven end to end with the owner of objects on the same engine.
service-com-amazonaws-s3-amazons3 = { workspace = true }

[lints]
workspace = true
