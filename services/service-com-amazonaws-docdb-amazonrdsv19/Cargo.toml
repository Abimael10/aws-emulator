[package]
name = "service-com-amazonaws-docdb-amazonrdsv19"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `state::new_request_id`'s digest: a maintained hash, so the per-response request id in an
# awsQuery `<ErrorResponse>` envelope is shaped by library code rather than by hand.
sha2 = { workspace = true }
hex = { workspace = true }
# `rds_cluster_parameters`: the cluster parameter catalog and the parameter rules the
# Amazon RDS, DocumentDB and Neptune models of the one `rds` front door share
# (`src/state.rs`).
# `db_data_sources`: the shared directory a minted `DbClusterResourceId` /
# `DbiResourceId` is recorded in, so a monitoring service (Performance Insights) can
# tell which service owns that id.
service-common = { path = "../common" }
# The AWS SDK for EC2, driven over the in-process callback
# (`OperationContext::callback`): the subnets a `CreateDBSubnetGroup` or
# `ModifyDBSubnetGroup` names are EC2's resources, so `src/state/ec2_subnets.rs` asks EC2
# whether each one exists and which VPC and Availability Zone it lies in rather than
# deciding it here. Only the generated client is needed — the emulator supplies the
# transport.
aws-sdk-ec2 = { version = "1", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The percent-encoder the test harness builds its awsQuery form bodies with
# (`tests/all/cluster_lifecycle.rs`), rather than hand-writing one.
percent-encoding = "2"
# The EC2 service, mounted beside this one in the test harness: that a subnet group reports
# the VPC and the zones of the subnets a client minted with `ec2:CreateSubnet` can only be
# driven end to end with the owner of subnets on the same engine. DEV-ONLY: this crate
# depends on no other service's crate outside its tests.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }

[lints]
workspace = true

