[package]
name = "service-com-amazonaws-osis-amazonopensearchingestionservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Content-derived identifiers: the pipeline-id segment of an ingestion endpoint host and
# the id of the VPC interface endpoint a VPC-attached pipeline gets are digests of the
# pipeline's own ARN, so they are stable across reads and unique per pipeline.
sha2 = { workspace = true }
# Opaque pagination cursors: hex-encode the internal list cursor so `NextToken` is a
# single-token string a client only ever echoes back.
hex = { workspace = true }
# A blueprint's configuration document is held as the YAML its record carries; this is the
# YAML reader that parses it so `GetPipelineBlueprint` can render the same document in the
# JSON format a caller may ask for. yaml-rust2 is the pure-Rust YAML 1.2 implementation the
# other services in this workspace read YAML with (no `unsafe`, no C bindings).
yaml-rust2 = { version = "0.10", default-features = false }
# `data_plane_addressing`: the tree's one reading of which address a resource's data plane is
# published at, so the ingestion endpoint a pipeline reports is the emulator's own.
# `s3_client`: the in-process Amazon S3 client the records an ingestion endpoint accepted are
# written to the configured bucket through. `arn`: the Region of the pipeline's own ARN, which
# is where that bucket is addressed. `yaml_nesting`: the bound on a caller-supplied
# configuration body's nesting, taken before it is parsed. `request_path`: the path of a
# runtime-API request, read the one way every data plane reads it.
service-common = { path = "../common" }
# The Amazon S3 request types that delivery builds (the object's body stream), from the SDK
# the shared client is constructed from. Only the generated client is needed: the emulator
# supplies the transport, so the SDK's own HTTPS stack is left out.
aws-sdk-s3 = { version = "1", default-features = false }
# The UTC calendar fields a delivered object's name carries (the second it was written), from
# the maintained calendar crate rather than by slicing a rendered timestamp.
chrono = { version = "0.4", default-features = false, features = ["std"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Declares one `mod <name>;` per `tests/all/<name>.rs`, so the single integration-test target
# at `tests/all/main.rs` picks up every suite without a hand-written declaration list.
automod = { workspace = true }
# `tests/all/ingest_data_plane.rs` asserts where the records a pipeline's ingestion endpoint
# accepted really ARRIVE, so the sink bucket is created through the wire of the service that
# OWNS it and the delivered object is read back through that service's own reader. DEV-ONLY.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# `tests/all/configuration_role_validation.rs` asserts WHICH roles a submitted pipeline
# configuration may name, and that question is IAM's answer about the role, so the roles are
# created through the wire of the service that OWNS them. DEV-ONLY.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }

[lints]
workspace = true
