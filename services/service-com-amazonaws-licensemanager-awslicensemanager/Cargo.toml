[package]
name = "service-com-amazonaws-licensemanager-awslicensemanager"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# The pre-handler refusal machinery every service shares: the violations of one
# request, with each value echo restored to the bytes the caller sent.
service-common = { path = "../common" }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes/decodes the opaque `NextToken` ListLicenseConfigurations hands out, and
# renders the digests the signed token a checkout answers with is built from.
hex = { workspace = true }
# SHA-256, the digest that token's key and its filler are derived with.
sha2 = { workspace = true }
# HMAC-SHA256, the keyed digest the signed token a checkout answers with carries.
hmac = "0.12"
# base64url, the encoding each segment of that compact-JWS token is written in.
base64 = "0.22"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
