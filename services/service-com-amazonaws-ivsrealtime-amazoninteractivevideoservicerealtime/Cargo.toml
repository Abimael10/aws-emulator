[package]
name = "service-com-amazonaws-ivsrealtime-amazoninteractivevideoservicerealtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `state::recording_bucket`: the Amazon S3 client a storage configuration's bucket is
# resolved through, and whose policy carries the recording grant the create writes — over
# the in-process callback into this same emulator. No network client feature is enabled:
# the transport is the emulator's own.
aws-sdk-s3 = { version = "1", default-features = false }
# `state`: the tree's one base64url coder and JOSE reading, which the compact form of an
# issued participant token is encoded with — a path dependency on this repository's own
# shared service crate, not a third-party component.
service-common = { path = "../common" }
# `state`: the HMAC of RFC 7518 section 3.2, which authenticates an issued participant
# token. An in-process COMPUTATION over data: it opens no listener, spawns nothing and
# reads nothing off the host. It is the cryptography library this workspace already signs
# and checks its tokens with (`service-common`'s JOSE reading and the user-pool service),
# so it is already in this workspace's build and lockfile and no capability class arrives
# with this declaration — and no second implementation of the primitive is written.
ring = "0.17"
# PEM decoding of the `publicKeyMaterial` an `ImportPublicKey` call carries.
pem = "3"
# SubjectPublicKeyInfo parsing, so an import is refused unless the material really is a
# DER-encoded public key.
spki = "0.7"
# MD5 digest: a public key's fingerprint is the MD5 of its public key's DER.
md-5 = "0.10"
# The RTMP protocol: the handshake, the chunk stream and the AMF0 commands an encoder
# publishing to a stage's `rtmp`/`rtmps` contribution endpoint speaks, which the stage
# ingest listener serves the server half of (`state::ingest_plane`).
rml_rtmp = "0.8"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Real key pairs for the public-key tests, so what they import is a genuine public key
# rather than a hand-built byte string.
rcgen = "0.13"
# The RTMP protocol, for the PUBLISHER side of the stage contribution plane: the suite that
# proves the announced `rtmp`/`rtmps` endpoints are dialable drives a real encoder's
# handshake, commands and media messages over a socket.
rml_rtmp = "0.8"
# The CLIENT side of the TLS an `rtmps://` encoder opens on that announced address:
# `rustls`/`tokio-rustls` run the handshake the core's own TLS server terminates, so the
# suite drives the encrypted wire a broadcaster really dials. TEST-ONLY.
rustls = { workspace = true }
tokio-rustls = "0.26"
# The storage-configuration suite mounts the service that OWNS a recording bucket beside
# this one on a single engine — exactly as the assembled emulator does — because a create
# resolves that bucket and amends its policy by calling it in process.
service-com-amazonaws-s3-amazons3 = { workspace = true }

[lints]
workspace = true
