[package]
name = "service-com-amazonaws-cloudcontrol-cloudapiservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared, authenticated continuation-token primitive every paginated read of
# this emulator mints its `NextToken` with.
service-common = { path = "../common" }
# Cloud Control API is a front end over the resource type's own provider, not an
# inventory of its own: an `AWS::Logs::LogGroup` lives in the CloudWatch Logs
# service's store, so this crate reads and writes it THERE.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
# The same rule for `AWS::SQS::Queue`: a queue lives in the Amazon SQS service's store,
# whichever API created it, so this crate reads and writes it THERE.
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
# And for `AWS::SNS::Topic`: a topic lives in the Amazon SNS service's store, which is
# also where the ARN its primary identifier is comes from.
service-com-amazonaws-sns-amazonsimplenotificationservice = { workspace = true }
# And for `AWS::S3::Bucket`: a bucket lives in the Amazon S3 service's store, so a bucket
# provisioned through this service is one that service's own API then serves objects in.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# And the Amazon S3 Tables store beside it: the metadata tables of a bucket's S3 Metadata
# configuration are records of THAT service, so a bucket deleted through this one hands them
# back to it rather than leaving them behind (`state::native::buckets`).
service-com-amazonaws-s3tables-s3tablebuckets = { workspace = true }
# And for `AWS::IAM::ManagedPolicy`: a customer managed policy lives in the IAM service's
# store, which is also where the ARN its primary identifier is comes from.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# And for `AWS::StepFunctions::StateMachine`: a state machine lives in the Step Functions
# service's store, which is also where the ARN its primary identifier is comes from.
service-com-amazonaws-sfn-awsstepfunctions = { workspace = true }
# And for `AWS::SSM::Parameter`: a parameter lives in the Systems Manager service's store,
# whichever API created it, so this crate reads and writes it THERE.
service-com-amazonaws-ssm-amazonssm = { workspace = true }
# And for `AWS::SecretsManager::Secret`: a secret lives in the AWS Secrets Manager service's
# store, whichever API created it, so this crate reads and writes it THERE — including the
# ARN its primary identifier is, which comes from that service's own ARN builder.
service-com-amazonaws-secretsmanager-secretsmanager = { workspace = true }
# And for `AWS::CloudWatch::Alarm`: a metric alarm lives in the Amazon CloudWatch service's
# store, so an alarm provisioned through this service is one that service's own
# `DescribeAlarms` reports and its own evaluation then grades.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# And for `AWS::DynamoDB::Table`: a table lives in the Amazon DynamoDB service's store,
# whichever API created it, so this crate reads and writes it THERE — including the stream a
# deleted table hands back, which that crate's own streams seam applies
# (`state::native::tables`).
service-com-amazonaws-dynamodb-dynamodb-20120810 = { workspace = true }
# The owning service of a resource type whose create does work of its own — it provisions
# the resources a template declares and reports a lifecycle of its own — is reached through
# that service's own API rather than through its store: an `AWS::CloudFormation::Stack` is
# created, read, patched and removed by CloudFormation's own calls, dispatched in process
# over the framework's callback (`state::owning_api::stacks`). No network client feature:
# the transport is the emulator's own.
aws-sdk-cloudformation = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# And `AWS::ApiGatewayV2::Api`, whose create does work of its own too — it imports an
# OpenAPI definition, with the routes and integrations that document declares — so the api is
# created, read, patched and removed by API Gateway v2's own calls, dispatched in process
# over the framework's callback (`state::owning_api::apis`). No network client feature: the
# transport is the emulator's own.
aws-sdk-apigatewayv2 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `PatchDocument` is an RFC 6902 JSON Patch document: apply it with a real
# implementation of that RFC rather than walking the operations by hand.
# `default-features = false` drops the `diff` feature, which this service never asks for.
json-patch = { version = "4.2", default-features = false }
# Opaque pagination tokens are hex-encoded, so a token this store did not mint is
# detectable rather than silently decoded.
hex = { workspace = true }
# A `ClientToken`'s record holds a digest of the request it carried, so a reuse with
# different parameters is told from a retry without keeping the request bodies.
sha2 = { workspace = true }
# `RequestToken`s and server-assigned primary identifiers are UUIDs: mint them with a
# real UUID implementation rather than assembling the text by hand.
uuid = { version = "1", features = ["v4"] }
# The regular expression a resource type's registry schema declares for a property is
# matched with the maintained regex engine rather than with a hand-rolled restatement of
# each character class (`state::registry_schema`).
regex = "1.13"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# One integration-test target rooted at `tests/all/main.rs`, which declares every
# `tests/all/<name>.rs` as a suite, so adding one is adding a file.
automod = { workspace = true }
# The service that OWNS `AWS::CloudFormation::Stack`: a suite about that type mounts it
# beside this one on the same engine, exactly as the assembled router does, and drives the
# stack through its own API — `DescribeStackResource` and `SignalResource` — while the
# Cloud Control request follows it.
service-com-amazonaws-cloudformation-cloudformation = { workspace = true }
# The test harness drives the services that OWN some resource types over their own
# `awsQuery` wire, whose form values are percent-encoded by this crate rather than by an
# encoder of ours.
percent-encoding = "2"

[lints]
workspace = true
