[package]
name = "service-com-amazonaws-simpledbv2-simpledbv2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `aws_validation_refusal`: the shared wording of a boundary constraint refusal on a
# JSON protocol, so this service carries no copy of its own of how AWS quotes a
# `@pattern` requirement (`src/service.rs`, `override_refusal`).
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque `nextToken` encoding for ListExports' pagination cursor, and the hex
# rendering of a minted identifier.
hex = { workspace = true }
# The digest behind a minted export id / client token, and the digest of the
# `domainName` filter a ListExports page token carries.
sha2 = { workspace = true }
# `aws-sdk-s3`: a domain export WRITES the exported items into the caller's bucket, which
# it does through Amazon S3's own `PutObject` over the emulator's in-process transport
# (`service_common::s3_client`).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# `hmac` + `sha1`: the HMAC the Signature Version 2 of the Amazon SimpleDB 2009-04-15 API
# computes its signature with, under either hash that API's `SignatureMethod` publishes
# (`HmacSHA1` and `HmacSHA256`, whose digest is `sha2` above).
hmac = "0.12"
sha1 = "0.10"
# `base64`: that signature travels base64-encoded.
base64 = "0.22"
# `percent-encoding`: the canonical encoding of the parameters that signature is computed
# over.
percent-encoding = "2"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `automod`: declares one module per `tests/all/<name>.rs`, so a new suite is a new file
# and nothing else.
automod = { workspace = true }
# `form_urlencoded`: the ONE encoder of the `application/x-www-form-urlencoded` body a
# SimpleDB 2009-04-15 request carries, so the suite that drives that wire
# (`tests/all/simpledb_query_api.rs`) sends what a client sends rather than a form it
# encoded by hand.
form_urlencoded = "1"
# `roxmltree`: that same suite READS the XML documents this API answers with through a
# real XML parser, so an assertion sees the text a client's parser sees (entities
# resolved) rather than the bytes on the wire.
roxmltree = "0.20"

[lints]
workspace = true
