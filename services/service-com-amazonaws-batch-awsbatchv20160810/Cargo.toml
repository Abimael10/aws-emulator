[package]
name = "service-com-amazonaws-batch-awsbatchv20160810"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hashes the entropy behind the UUID-shaped `jobId`/compute environment `uuid` this
# service mints (`state::new_uuid`).
sha2 = { workspace = true }
# Opaque, URL-safe encoding for the pagination cursors this service vends, and for the
# hex groups of those ids.
hex = { workspace = true }
# The shared framing of a response that carries no content: the status such an answer
# carries and the correction that empties the body a serializer rendered for it
# (`service_common::no_content_responses`), which this service's tag mutations answer at.
service-common = { path = "../common" }
# The AWS SDK for EventBridge, driven over the in-process callback
# (`OperationContext::callback`): AWS Batch publishes a `Batch Job State Change`
# event onto the account's default event bus as a job moves through its statuses
# (`state::publish_job_state_changes`). Only the generated client is needed — the
# emulator supplies the transport, so the SDK's own HTTPS stack and runtime are
# left out.
aws-sdk-eventbridge = { version = "1", default-features = false }
# The AWS SDK for CloudWatch Logs, driven over the same in-process callback: the log
# stream a placed job's container writes to has to EXIST where CloudWatch Logs holds it,
# so the placement creates it there (`state::job_logs`) rather than keeping a second copy
# of the log store in this crate.
aws-sdk-cloudwatchlogs = { version = "1", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# EventBridge and SQS are mounted beside Batch on one engine in the integration tests,
# because Batch publishes a `Batch Job State Change` event onto the default event bus on
# every job transition and a rule on that bus delivers it to an SQS queue: without them
# mounted there is nothing for the publication to reach. CloudWatch Logs is mounted there
# too, because a placed job's log stream is created in it (`state::job_logs`) and the tests
# read and delete that stream through its own API.
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
# SageMaker AI is mounted beside Batch on that same engine too, because a service job's
# work is DISPATCHED to it as a `CreateTrainingJob` request
# (`state::service_job_dispatch`): without it mounted there is nothing for the dispatch to
# reach. Amazon S3 goes with it, because a training job's run reads its channels and writes
# its model artifact in the service that OWNS objects.
service-com-amazonaws-sagemaker-sagemaker = { workspace = true }
service-com-amazonaws-s3-amazons3 = { workspace = true }

[lints]
workspace = true
