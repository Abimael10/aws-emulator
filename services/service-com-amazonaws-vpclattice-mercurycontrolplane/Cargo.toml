[package]
name = "service-com-amazonaws-vpclattice-mercurycontrolplane"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hashes the entropy of a minted resource id.
sha2 = { workspace = true }
# Encodes the opaque `nextToken` cursor a paginated listing hands back.
hex = { workspace = true }
# Evaluates the modelled `@pattern` of a resource name, which is written with negative
# look-ahead the `regex` crate behind `@pattern` cannot compile.
fancy-regex = "0.16"
# The shared rendering of a `@pattern` requirement in a constraint-violation message, the
# addressing a data-plane request is read with, and the register a server a workload of this
# emulator runs is published in — which is what an `IP` or `INSTANCE` target group forwards to.
service-common = { path = "../common" }
# The Lambda client a `forward` to a `LAMBDA` target group invokes the registered function
# with, driven over the emulator's own in-process transport
# (`OperationContext::callback`) — the function is Lambda's resource, so the invocation is
# made by calling that service rather than by reaching into its state
# (`src/service/lambda_target.rs`). Only the generated client is needed: the transport is the
# emulator's own, so no network client feature is enabled.
aws-sdk-lambda = { version = "1", default-features = false }
# The `application/x-www-form-urlencoded` query string a data-plane request carries, read into
# the query-string parameters the Lambda event states.
form_urlencoded = "1"

[dev-dependencies]
# The Lambda service, so the data-plane suites can create a real function through the service
# that OWNS functions and watch what a `forward` to a `LAMBDA` target group answers with.
# TEST-ONLY — `src/` reaches that service over the in-process callback instead.
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }
# The .zip deployment package such a function is created from, written in memory the way a
# caller uploads one. TEST-ONLY.
zip = { version = "9", default-features = false, features = ["deflate"] }
# The integration tests wait out a clock-owed transition by looking again, which needs the
# timer driver on top of the workspace's tokio features.
tokio = { workspace = true, features = ["time"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
