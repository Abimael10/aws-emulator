[package]
name = "service-com-amazonaws-wickr-wickradminapi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# The response-media-type rule every service whose recorded wire announces a media type of
# its own takes: the pair, the re-announcer, and the operation-seam wrapper that carries it
# around the centralized walk (see `src/service/response_envelope.rs`).
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# SHA-256 for the content-derived `uname` / invite code a created user carries, and for the
# entity tag every response validates its body with.
sha2 = { workspace = true }
# Hex codec for those digests, for that entity tag and for the opaque pagination tokens.
hex = { workspace = true }

[dev-dependencies]
# Declares one module per `tests/all/<name>.rs`, so a new suite needs no edit here.
automod = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
