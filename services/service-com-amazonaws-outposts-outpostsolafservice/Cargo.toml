[package]
name = "service-com-amazonaws-outposts-outpostsolafservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# Amazon EC2 owns an instance and the Dedicated Hosts an account's Outpost capacity is
# allocated as, so what runs on an Outpost is read off that service's own store.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hashing for the unique `os-…` / `op-…` resource ids this service mints.
sha2 = { workspace = true }
# Hex codec for those ids, whose modelled patterns are 17 lowercase hex chars.
hex = { workspace = true }
# Calendar arithmetic for the subscription terms this service bills in months, and
# the date rendering the modelled `ContractEndDate` carries.
chrono = { version = "0.4", default-features = false, features = ["std"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# Calendar arithmetic for the subscription terms the billing suite checks.
chrono = { version = "0.4", default-features = false, features = ["std"] }

[lints]
workspace = true
