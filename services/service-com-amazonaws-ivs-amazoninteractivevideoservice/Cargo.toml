[package]
name = "service-com-amazonaws-ivs-amazoninteractivevideoservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hashing for the unique resource ids this service mints (channel ids, stream-key
# ids and stream-key values).
sha2 = { workspace = true }
# Hex codec for those ids and for the opaque `PaginationToken` this service issues.
hex = { workspace = true }
# PEM decoding of the `publicKeyMaterial` an `ImportPlaybackKeyPair` call carries.
pem = "3"
# SubjectPublicKeyInfo parsing, so an import is refused unless the material really
# is a DER-encoded public key.
spki = "0.7"
# MD5 digest: a playback key pair's fingerprint is the MD5 of its public key's DER.
md-5 = "0.10"
# The modelled `@pattern` this service enforces itself (the tagging `ResourceArn`, whose
# modelled pattern no IVS ARN can satisfy) is run through the same regex engine the
# framework's own constraint walk uses, at the minor version that walk pins.
regex = "1.12"
# `service-common` carries the ONE reading of which address this emulator is reached at,
# which the playback URL every channel projection announces is built on, the one
# caller-supplied-ARN parse, the in-process Amazon S3 client, and the framing of a
# response that carries no content.
service-common = { path = "../common" }
# The AWS SDK for Amazon S3, driven over the in-process callback
# (`OperationContext::callback`): `CreateRecordingConfiguration` resolves the bucket its
# destination names in THIS emulator's own object store before it mints a configuration.
# Only the generated client is needed — the emulator supplies the transport, so the SDK's
# own HTTPS stack and runtime are left out.
aws-sdk-s3 = { version = "1", default-features = false }
# The AWS SDK for AWS Elemental MediaTailor, over the same transport:
# `CreateAdConfiguration` resolves each playback configuration its request references.
aws-sdk-mediatailor = { version = "1", default-features = false }
# The RTMP protocol: the handshake, the chunk stream and the AMF0 commands an encoder
# publishing to a channel's contribute endpoint speaks, which the ingest listener serves
# the server half of.
rml_rtmp = "0.8"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# The RTMP protocol, for the PUBLISHER side of the contribute plane: the suite that proves
# the announced ingest address is dialable drives a real encoder's handshake, commands and
# media messages over a socket.
rml_rtmp = "0.8"
# Real key pairs for the playback-key-pair tests, so what they import is a genuine
# public key rather than a hand-built byte string.
rcgen = "0.13"
# The bucket a recording configuration names and the playback configuration an ad
# configuration references are resources of those two services, so the suite that drives
# the admission checks mounts them beside this one on ONE engine: what a create resolves
# is a real bucket of this object store and a real MediaTailor configuration, each
# created and removed through its own API.
service-com-amazonaws-s3-amazons3 = { workspace = true }
service-com-amazonaws-mediatailor-mediatailor = { workspace = true }

[lints]
workspace = true
