[package]
name = "service-com-amazonaws-backup-cryocontrollerusermanager"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque, URL-safe encoding for the pagination cursors this service vends.
hex = { workspace = true }
# Draws the random identifier the opaque version token of a stored backup plan
# version is the text of, so the token comes from entropy rather than from the
# plan it versions (`state::minted_plan_version_id`).
uuid = { version = "1", features = ["v4"] }
# Parses the cron expression a backup rule schedules its jobs with, so a plan's
# upcoming runs are computed from that expression (and `chrono`, which it is
# built on, carries the date and time arithmetic).
cron = "0.15"
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Resolves the IANA time zone a backup rule names, so its schedule is read in
# that zone rather than only in UTC.
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
# The AWS SDK for EventBridge, driven over the in-process callback
# (`OperationContext::callback`): AWS Backup publishes a `Backup Job State Change`
# or `Copy Job State Change` event onto the account's default event bus as a job
# moves (`state::publish_job_state_changes`). Only the generated client is needed —
# the emulator supplies the transport, so the SDK's own HTTPS stack and runtime are
# left out.
aws-sdk-eventbridge = { version = "1", default-features = false }
# The AWS SDK for DynamoDB, driven over the in-process callback
# (`OperationContext::callback`): a restore re-creates the protected resource in
# the service that owns it, so the restore of a DynamoDB table recovery point
# creates that table through DynamoDB's own API
# (`state::restore_execution::perform_restore`). Only the generated client is
# needed — the emulator supplies the transport.
aws-sdk-dynamodb = { version = "1", default-features = false }
# The AWS SDK for Multi-party Approval, driven over the same in-process callback: the
# approval team a vault is put under has to be a team the service that MINTS teams holds,
# so `MpaApprovalTeamArn` is resolved through that service's own read
# (`state::mpa_approval_team`). Only the generated client is needed — the emulator
# supplies the transport.
aws-sdk-mpa = { version = "1", default-features = false }
# The KMS service crate, for the Amazon Web Services managed key a backup vault
# created with no `EncryptionKeyArn` is encrypted under: the key behind the
# predefined `alias/aws/backup` alias is resolved in the KMS store on the shared
# engine, so the ARN a vault publishes is one `kms:DescribeKey` resolves
# (`state::vault_encryption_key`).
service-com-amazonaws-kms-trentservice = { workspace = true }
# The Application Auto Scaling store, for the auto scaling settings in force on a
# protected resource's capacity: the restore metadata a backup captures describes
# them, and the service that owns them is the only component that holds them
# (`state::captured_restore_metadata`).
service-com-amazonaws-applicationautoscaling-anyscalefrontendservice = { workspace = true }
# The STS store, for the identity an access key id speaks for: the principal
# `sts:GetCallerIdentity` answers for the credentials a request signed with, which is
# the caller a call that starts a job is authorized as
# (`state::caller_authorization`).
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The IAM store, for the identity-based policy documents in force on that principal,
# and for what a backup job's own role is allowed to create.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# `eventbridge_client`: the tree's ONE construction of that in-process EventBridge
# client, so this service configures the publication hop exactly as every other
# publisher does. `iam_role`: the shared reading of a caller-supplied IAM role ARN
# and of what this account's IAM answers about it, for the role a backup
# selection's jobs would run as and for what a backup job's role is allowed to
# create; `iam_client` under it is the in-process hop that asks IAM, and
# `iam_authorization` is the tree's one wording of the denial that answers.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Declares tests/all/main.rs's suite modules, one per tests/all/<name>.rs.
automod = { workspace = true }
sha2 = { workspace = true }
# EventBridge and SQS are mounted beside Backup on one engine in the integration
# tests, because a job transition publishes a state-change event onto the default
# event bus and a rule on that bus delivers it to an SQS queue target: without them
# mounted there is nothing for the publication to reach.
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
# Amazon SNS is mounted beside them for the fan-out leg: a rule's target may be an SNS
# topic, which hands what it is published to its own SQS subscriber, so the envelope a
# client reads arrives through that topic.
service-com-amazonaws-sns-amazonsimplenotificationservice = { workspace = true }
# DynamoDB is mounted beside Backup in the restore suite: a restore re-creates
# the protected resource in the service that owns it, so the table a restore
# creates is read back through DynamoDB's own wire.
service-com-amazonaws-dynamodb-dynamodb-20120810 = { workspace = true }
# Multi-party approval is mounted beside Backup in the approval-team suite: the team a
# vault is put under is resolved through that service's own read, so the team a case
# associates is one created through its create and read back through its get.
service-com-amazonaws-mpa-awsfluffycoreservice = { workspace = true }
# AWS Organizations is mounted with it because creating an approval team is restricted to
# the management account of the organization Organizations records, which that service is
# the keeper of.
service-com-amazonaws-organizations-awsorganizationsv20161128 = { workspace = true }

[lints]
workspace = true
