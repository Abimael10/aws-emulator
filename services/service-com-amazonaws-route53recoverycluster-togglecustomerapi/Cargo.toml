[package]
name = "service-com-amazonaws-route53recoverycluster-togglecustomerapi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `service-common` carries two readers the authorization gate
# (`src/service/authorization.rs`) needs. `iam_authorization`: the shared evaluation of IAM
# policy documents against an action on a resource, so this service reads a document
# exactly as every other service does, and the shared wording of the refusal.
# `iam_role`: which IAM entity a principal ARN names.
service-common = { path = "../common" }
# The STS store, for the identity an access key id speaks for: the principal
# `sts:GetCallerIdentity` answers for the credentials a request signed with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The IAM store, for the identity-based policy documents in force on that principal and the
# permissions boundary that caps them.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque `NextToken` cursors for ListRoutingControls are hex-encoded with this
# crate (already a workspace dependency) rather than a hand-written codec.
hex = { workspace = true }
# The recovery-control CONFIG (control-plane) service, which creates every cluster,
# control panel and routing control this data plane reads and toggles: its store is the
# registry `src/state.rs` reads through the shared engine.
service-com-amazonaws-route53recoverycontrolconfig-route53recoverycontrolconfig = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# Mounted BESIDE this service in `tests/all/`: the IAM and STS services, whose stores hold
# the role, its policies and the session the authorization suite's callers present.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }

[lints]
workspace = true
