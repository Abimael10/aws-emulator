[package]
name = "service-com-amazonaws-inspectorscan-inspectorscan"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The SBOM content digest (idempotent repeat detection) and its hex rendering.
# Both are the workspace's own entries and were already declared by this crate's
# scaffold, so naming them here leaves the workspace `Cargo.lock` byte-identical:
# a package's dev and normal dependencies are one list in the lockfile.
sha2 = { workspace = true }
hex = { workspace = true }
# `iam_authorization` (the one shared evaluation of IAM policy documents and the
# one wording of an authorization refusal) and `validation_message`
# (`in_hashed_enum_order`, the one derivation of the order an enumerated type's
# admissible set is listed in).
service-common = { path = "../common" }
# `ScanSbom` is decided against the CALLING principal's identity-based policies
# before it scans (`service::authorization`): the principal an access key id
# speaks for is the session the token service minted it for — the record
# `GetCallerIdentity` answers from — or the IAM user that owns a long-term key,
# and the documents in force on it live in the IAM emulator's own store. Both
# are reached through the one shared engine, which needs the owning services'
# state TYPES.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }

# NOTHING ELSE is declared. The percent-decoding a `purl` segment needs comes
# from `smithy_server_runtime::percent_decode`, already a dependency above, and
# the one thing left in this crate is purl's own decomposition of a coordinate
# per the specification's layout, plus a release compared against an advisory's
# two bounds, which `crate::state` holds as DATA so there is no range expression
# to evaluate. See
# services/service-com-amazonaws-ssmguiconnect-ssmguiconnect's manifest for the
# same note.

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# One integration-test target rooted at `tests/all/main.rs`: `automod` declares
# one module per `tests/all/<name>.rs`, so a new suite is a new file with nothing
# to declare.
automod = { workspace = true }

[lints]
workspace = true
