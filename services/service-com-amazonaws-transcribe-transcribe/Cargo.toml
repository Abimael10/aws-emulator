[package]
name = "service-com-amazonaws-transcribe-transcribe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The Amazon S3 client this service reaches its companion object store with, over
# the in-process callback into this same emulator (no network client feature is
# enabled: the transport is the emulator's own): a job start resolves its `Media`
# location through it, `CreateLanguageModel` resolves a custom language model's
# training and tuning data, and the custom-vocabulary and vocabulary-filter creates
# and updates store the text file their reported `DownloadUri` serves.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# Reads the audio properties out of a stored media file's own container and codec
# headers, which is where the sample rate a finished job reports is determined from.
lofty = { version = "0.25" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Declares one module per `tests/all/<name>.rs`, so the single integration-test target
# at `tests/all/main.rs` picks up every suite with nothing to declare by hand.
automod = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# The media-resolution, training-data and download-content suites mount the Amazon S3
# service beside transcribe on one engine: a job start resolves the media location it
# is given against Amazon S3 before it stores anything, `CreateLanguageModel` resolves
# the data a model is trained from, and a vocabulary's and a filter's content is stored
# in object storage by calling S3 in process and fetched back by its reported location.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# Writes the RIFF/WAVE fixtures the determined-media-properties suite uploads, so the
# media a job is pointed at carries a real container header stating a real sample rate
# rather than bytes shaped like one.
hound = "3.5"

[lints]
workspace = true
