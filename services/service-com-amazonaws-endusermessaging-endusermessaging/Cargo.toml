[package]
name = "service-com-amazonaws-endusermessaging-endusermessaging"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque pagination tokens: hex-encodes the continuation key so the token stays
# inside `NextToken`'s modelled pattern whatever a resource id contains.
hex = { workspace = true }
# Fingerprints the parameters an idempotency token served, so a replay carrying other
# parameters is told apart from a repeat of the request itself without keeping a copy of
# the uploaded attachment bytes.
sha2 = { workspace = true }
# Draws the characters of a one-time passcode uniformly from the character set the
# resolved code type names.
rand = "0.9"
# Reads the media type an uploaded brand-profile attachment announces in its own
# magic-number signature, which is what `mediaContentType` reports: the request
# carries the bytes alone and declares no type for them.
infer = "0.22"
# `service-common` carries the workspace's one ARN parse (`arn`), which reads a
# caller-supplied `resourceArn`'s vendor, Region and resource type, and
# `data_plane_addressing`: the reserved path namespace every emulated data plane is
# addressed under, so the attribute-media plane claims no path another plane or
# control route could.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Encodes an attachment body the way restJson1 carries a blob member, so the tests
# upload media over the same wire an SDK client does.
base64 = "0.22"
# RFC 3986 percent-encoding, so the tag-removal suite can put a tag key carrying a
# space, a colon, a `+` or a `/` in the `tagKeys` query string the way a client does.
percent-encoding = "2.3"

[lints]
workspace = true
